{{template "base" .}}

{{define "main"}}
<div class="container" style="max-width: 400px; margin: 4rem auto;">
    <div class="card" style="text-align: center; padding: 2rem;">
        <h1 style="margin-bottom: 1rem;">Sign Out</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Are you sure you want to sign out?</p>
        
        <form action="/logout" method="POST">
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="/" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary" style="background-color: #ef4444; border-color: #ef4444;">Sign Out</button>
            </div>
        </form>
    </div>
</div>
{{end}}
