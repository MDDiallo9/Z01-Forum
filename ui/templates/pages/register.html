{{template "base" .}}

{{define "main"}}
<div class="container" style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 2rem;">Register</h1>
        <form method="POST" action="/register" enctype="multipart/form-data">
            {{with .Form}}
            <div class="form-group">
                <label for="username">Username</label>
                {{with .FieldErrors.username}}
                    <label class='error-message'>{{.}}</label>
                {{end}}
                <input type="text" id="username" name="username" value="{{.Username}}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                {{with .FieldErrors.email}}
                    <label class='error-message'>{{.}}</label>
                {{end}}
                <input type="email" id="email" name="email" value="{{.Email}}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                {{with .FieldErrors.password}}
                    <label class='error-message'>{{.}}</label>
                {{end}}
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                {{with .FieldErrors.confirm_password}}
                    <label class='error-message'>{{.}}</label>
                {{end}}
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <div class="form-group">
                <label for="avatar">Avatar (Optional)</label>
                <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg" style="background: white;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
            {{else}}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <div class="form-group">
                <label for="avatar">Avatar (Optional)</label>
                <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg" style="background: white;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
            {{end}}
            
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <p style="color: var(--text-muted);">Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a></p>
            </div>
        </form>
    </div>
</div>
{{end}}
