{{template "base" .}}

{{define "main"}}
<div class="container" style="max-width: 600px; margin: 4rem auto;">
    <div class="card">
        <h1 style="margin-bottom: 1.5rem;">Report Post</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Please describe why you are reporting this post. Our moderators will review it shortly.</p>

        <form action="" method="POST">
            <div class="form-group">
                <label for="reason">Reason for Reporting</label>
                <select id="reason" name="reason" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: white; color: var(--text-main);">
                    <option value="">Select a reason...</option>
                    <option value="spam">Spam or Misleading</option>
                    <option value="harassment">Harassment or Hate Speech</option>
                    <option value="violence">Violence or Physical Harm</option>
                    <option value="adult">Adult Content</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Additional Details (Optional)</label>
                <textarea id="details" name="details" rows="4" placeholder="Provide more context..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; resize: vertical;"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                <a href="javascript:history.back()" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit Report</button>
            </div>
        </form>
    </div>
</div>
{{end}}
