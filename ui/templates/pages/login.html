{{template "base" .}}

{{define "main"}}
<div class="container" style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 2rem;">Sign In</h1>
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
            
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <p style="color: var(--text-muted);">Don't have an account? <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up</a></p>
            </div>
        </form>
    </div>
</div>
{{end}}
